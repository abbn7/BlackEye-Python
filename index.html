<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdelhamed Nada - عبدالحميد ندى</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #fff;
        }
        
        h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #e0e0e0;
        }
        
        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        .github-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            margin-top: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .github-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .emoji {
            font-size: 1.2em;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>عبدالحميد ندى</h1>
        <h2>Abdelhamed Nada</h2>
        
        <p><span class="emoji">👋</span> مرحباً بك في موقعي الشخصي</p>
        <p><span class="emoji">💻</span> مطور ومهتم بالتكنولوجيا والبرمجة</p>
        <p><span class="emoji">🚀</span> أعمل على مشاريع متنوعة في مجال البرمجة</p>
        
        <p><strong>GitHub:</strong> abbn7</p>
        <p><strong>التخصص:</strong> تطوير برامج وأنظمة تقنية</p>
        
        <a href="https://github.com/abbn7" class="github-btn" target="_blank">
            <span class="emoji">🌟</span> زيارة حسابي على GitHub
        </a>
    </div>
</body>
</html>
